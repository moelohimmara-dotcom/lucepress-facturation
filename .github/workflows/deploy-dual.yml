name: Deploy dual (Cloudflare + Netlify)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend + Netlify function
        run: |
          pnpm build:netlify
          pnpm build:function

      - name: Deploy Cloudflare (primaire)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets Cloudflare absents — deploy primaire ignoré"
            exit 0
          fi
          npx --yes wrangler@4 deploy --config wrangler.toml

      - name: Deploy Netlify (secours)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::Secrets Netlify absents — deploy secours ignoré"
            exit 0
          fi
          npx --yes netlify-cli deploy --prod --no-build \
            --dir=dist/public \
            --functions=netlify/functions \
            --site="$NETLIFY_SITE_ID" \
            --message "ci: dual deploy ${GITHUB_SHA}"
