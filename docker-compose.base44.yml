services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: lucepress
      MYSQL_USER: lucepress
      MYSQL_PASSWORD: lucepress_dev_password
      MYSQL_ROOT_PASSWORD: lucepress_root_dev_password
    volumes:
      - base44_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - base44_node_modules:/app/node_modules
      - base44_pnpm_store:/pnpm/store
    environment:
      DATABASE_URL: mysql://lucepress:lucepress_dev_password@db:3306/lucepress
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm exec drizzle-kit migrate"

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - base44_node_modules:/app/node_modules
      - base44_pnpm_store:/pnpm/store
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: mysql://lucepress:lucepress_dev_password@db:3306/lucepress
      JWT_SECRET: base44-local-development-secret-2026-lucepress
      VITE_APP_ID: lucepress-local
      VITE_OAUTH_PORTAL_URL: https://auth.manus.im
      OAUTH_SERVER_URL: https://auth.manus.im
      ALLOWED_ORIGINS: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      CHOKIDAR_USEPOLLING: "true"
      PNPM_HOME: /pnpm
      PNPM_STORE_DIR: /pnpm/store
    env_file:
      - /run/base44/app.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >-
      sh -c "corepack enable && pnpm dev"

volumes:
  base44_mysql_data:
  base44_node_modules:
  base44_pnpm_store:
